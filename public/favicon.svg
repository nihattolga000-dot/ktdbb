<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="15.5" fill="white" stroke="#111111" stroke-width="1"/>
  <!-- Inner filled circle -->
  <circle cx="16" cy="16" r="13" fill="#111111"/>
  <!-- Stylized wolf head (Bozkurt) - simplified geometric -->
  <!-- Body/neck -->
  <polygon points="8,24 11,16 16,22 21,16 24,24" fill="white"/>
  <!-- Head -->
  <polygon points="11,16 13,10 16,8 19,10 21,16 16,19" fill="white"/>
  <!-- Ear -->
  <polygon points="13,10 14,7 16,8" fill="#111111"/>
  <polygon points="19,10 18,7 16,8" fill="#111111"/>
  <!-- Eye -->
  <circle cx="14.5" cy="13" r="0.8" fill="#111111"/>
  <!-- Nose/mouth detail -->
  <rect x="18" y="15" width="4" height="1.2" fill="#111111" rx="0.5"/>
</svg>